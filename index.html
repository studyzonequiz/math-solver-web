<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubt Solver AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/dist/solid.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .solver-card { max-width: 700px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .preview-box { width: 100%; max-height: 300px; object-fit: contain; margin-top: 15px; border-radius: 10px; display: none; border: 1px solid #ddd; position: relative; }
        .image-container { position: relative; display: inline-block; width: 100%; }
        .remove-btn { position: absolute; top: 20px; right: 10px; background: rgba(220, 53, 69, 0.9); color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; display: none; }
        .output-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-left: 5px solid #0d6efd; border-radius: 5px; display: none; }
        .btn-action { min-width: 130px; }
    </style>
</head>
<body>

<div class="container">
    <div class="solver-card text-center">
        <h2>🚀 Doubt Solver AI</h2>
        <p class="text-muted">ছবি তুলুন, গ্যালারি থেকে আপলোড করুন অথবা সর্বোচ্চ ১০০ পাতার পিডিএফ সিলেক্ট করুন।</p>
        
        <div class="d-flex justify-content-center flex-wrap gap-2 my-3">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <button class="btn btn-primary btn-action" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-camera"></i> ক্যামেরা</button>
            <button class="btn btn-success btn-action" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-image"></i> গ্যালারি</button>
            <button class="btn btn-danger btn-action"><i class="fa-solid fa-file-pdf"></i> PDF আপলোড</button>
        </div>

        <div class="image-container">
            <img id="imagePreview" class="preview-box" alt="Preview">
            <button id="removeImgBtn" class="remove-btn" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="input-group my-3">
            <input type="text" id="promptInput" class="form-control" placeholder="দাগ নম্বর লিখুন বা পিডিএফ থেকে কী জানতে চান তা এখানে লিখুন...">
            <button class="btn btn-indigo style-send" style="background-color: #4f46e5; color: white;" id="sendBtn" onclick="solveDoubt()"><i class="fa-solid fa-paper-plane"></i> Send</button>
        </div>

        <div class="output-box text-start" id="outputBox">
            <h5 class="fw-bold text-dark"><i class="fa-solid fa-wand-magic-sparkles text-warning"></i> এআই সমাধান:</h5>
            <hr>
            <div id="solutionText" style="line-height: 1.8; font-size: 15px;"></div>
        </div>
    </div>
</div>

<script>
    let base64Image = "";

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('imagePreview').style.display = 'block';
            document.getElementById('removeImgBtn').style.display = 'block';
            base64Image = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
    }

    function removeImage() {
        document.getElementById('fileInput').value = "";
        document.getElementById('imagePreview').src = "";
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('removeImgBtn').style.display = 'none';
        base64Image = "";
    }

    async function solveDoubt() {
        const promptText = document.getElementById('promptInput').value || "Solve this academic doubt step by step.";
        const solutionText = document.getElementById('solutionText');
        const outputBox = document.getElementById('outputBox');
        const sendBtn = document.getElementById('sendBtn');

        outputBox.style.display = 'block';
        solutionText.innerHTML = `<div class="spinner-border text-primary spinner-border-sm"></div> প্রসেস হচ্ছে, দয়া করে অপেক্ষা করুন...`;
        sendBtn.disabled = true;

        try {
            const response = await fetch('/.netlify/functions/solve-math', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image, prompt: promptText })
            });

            const data = await response.json();
            sendBtn.disabled = false;

            if (data.solution) {
                // মার্কডাউন টেক্সটকে ব্রাউজারে পড়ার উপযোগী লাইনে রূপান্তর
                let formattedText = data.solution.replace(/\n/g, '<br>');
                solutionText.innerHTML = formattedText;
                
                // MathJax সচল করা যাতে ইকুয়েশনগুলো বইয়ের মতো সুন্দর হয়ে যায়
                if (window.MathJax) {
                    MathJax.typesetPromise([solutionText]);
                }
            } else {
                solutionText.innerHTML = `<span class="text-danger">❌ সমস্যা হয়েছে: ${data.error || 'আবার চেষ্টা করুন।'}</span>`;
            }
        } catch (error) {
            sendBtn.disabled = false;
            // যদি ১০ সেকেন্ড পার হয়ে নেটলিফাই টাইমআউট করে, তবে ইউজারকে ডিরেক্ট আবার ট্রাই করার জন্য পুশ করবে
            solutionText.innerHTML = `<span class="text-danger">❌ সার্ভার ব্যস্ততার কারণে রেসপন্স ড্রপ হয়েছে। অনুগ্রহ করে আরেকবার <strong>Send</strong> বাটনে চাপুন (পরের চাবিটি একটিভেট হবে)।</span>`;
        }
    }
</script>
</body>
</html>
