<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubt Solver AI - STUDY ZONE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/dist/solid.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --btn-camera: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --btn-gallery: linear-gradient(135deg, #10b981, #059669);
            --btn-pdf: linear-gradient(135deg, #ef4444, #dc2626);
        }

        body { 
            background: var(--bg-gradient); 
            font-family: 'Hind Siliguri', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .solver-card { 
            max-width: 720px; 
            width: 100%;
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .header-section {
            margin-bottom: 30px;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin: 0;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: nowrap; /* বাটনগুলোকে এক লাইনে রাখবে */
            margin-bottom: 25px;
        }

        .btn-action { 
            border: none;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-width: 120px;
            white-space: nowrap;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            color: #ffffff;
        }

        .btn-camera-style { background: var(--btn-camera); }
        .btn-gallery-style { background: var(--btn-gallery); }
        .btn-pdf-style { background: var(--btn-pdf); }

        .image-container { 
            position: relative; 
            width: 100%;
            margin-bottom: 25px;
        }

        .preview-box { 
            width: 100%; 
            max-height: 320px; 
            object-fit: contain; 
            border-radius: 14px; 
            display: none; 
            border: 2px dashed #cbd5e1;
            padding: 6px;
            background: #f8fafc;
        }

        .remove-btn { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: #ef4444; 
            color: #ffffff; 
            border: none; 
            border-radius: 50%; 
            width: 32px;
            height: 32px;
            display: none; 
            align-items: center;
            justify-content: center;
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(239,68,68,0.3);
            transition: all 0.2s ease;
            z-index: 5;
        }

        .remove-btn:hover {
            transform: scale(1.1);
            background: #dc2626;
        }

        .input-section {
            margin-bottom: 25px;
        }

        .custom-input-group {
            display: flex;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 6px 8px;
            transition: all 0.2s ease;
        }

        .custom-input-group:focus-within {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .custom-control {
            border: none;
            background: transparent;
            padding: 10px 12px;
            font-size: 15px;
            width: 100%;
            outline: none;
            color: #1e293b;
        }

        .btn-send {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-send:hover {
            background: var(--primary-hover);
        }

        .btn-send:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .output-box { 
            margin-top: 25px; 
            padding: 24px; 
            background: #f8fafc; 
            border-left: 5px solid var(--primary-color); 
            border-radius: 14px; 
            display: none; 
            text-align: left;
        }

        .output-header {
            font-size: 17px;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .solution-content {
            line-height: 1.8; 
            font-size: 15.5px;
            color: #334155;
        }

        .footer-credit { 
            margin-top: 35px; 
            border-top: 1px solid #e2e8f0; 
            padding-top: 18px; 
            font-size: 14px; 
            font-weight: 500; 
            color: #94a3b8; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .footer-credit span { 
            color: #10b981; 
            font-weight: 700; 
        }

        /* মোবাইল স্ক্রিনের জন্য বাটনগুলো রেসপন্সিভ করা */
        @media (max-width: 576px) {
            .button-group {
                flex-wrap: wrap;
            }
            .btn-action {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="solver-card">
    <div class="header-section text-center">
        <h1 class="main-title">🚀 Doubt Solver AI</h1>
        <p class="subtitle">ছবি তুলুন, গ্যালারি থেকে আপলোড করুন অথবা সর্বোচ্চ ১০০ পাতার পিডিএফ সিলেক্ট করুন।</p>
    </div>
    
    <div class="button-group">
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
        <button class="btn-action btn-camera-style" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-camera"></i> ক্যামেরা</button>
        <button class="btn-action btn-gallery-style" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-image"></i> গ্যালারি</button>
        <button class="btn-action btn-pdf-style"><i class="fa-solid fa-file-pdf"></i> PDF আপলোড</button>
    </div>

    <div class="image-container">
        <img id="imagePreview" class="preview-box" alt="Preview">
        <button id="removeImgBtn" class="remove-btn" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="input-section">
        <div class="custom-input-group">
            <input type="text" id="promptInput" class="custom-control" placeholder="দাগ নম্বর লিখুন বা পিডিএফ থেকে কী জানতে চান তা এখানে লিখুন...">
            <button class="btn-send" id="sendBtn" onclick="solveDoubt()"><i class="fa-solid fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <div class="output-box" id="outputBox">
        <div class="output-header">
            <i class="fa-solid fa-wand-magic-sparkles text-warning"></i> এআই সমাধান:
        </div>
        <div class="solution-content tex2jax_process" id="solutionText"></div>
    </div>

    <div class="footer-credit">
        <i class="fa-solid fa-circle-check text-success"></i> Created & Developed by <span>STUDY ZONE</span>
    </div>
</div>

<script>
    let base64Image = "";

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('imagePreview').style.display = 'block';
            document.getElementById('removeImgBtn').style.display = 'flex';
            base64Image = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
    }

    function removeImage() {
        document.getElementById('fileInput').value = "";
        document.getElementById('imagePreview').src = "";
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('removeImgBtn').style.display = 'none';
        base64Image = "";
    }

    async function solveDoubt() {
        const promptText = document.getElementById('promptInput').value || "Solve this academic doubt step by step.";
        const solutionText = document.getElementById('solutionText');
        const outputBox = document.getElementById('outputBox');
        const sendBtn = document.getElementById('sendBtn');

        outputBox.style.display = 'block';
        solutionText.innerHTML = `<div class="spinner-border text-primary spinner-border-sm"></div> প্রসেস হচ্ছে, দয়া করে অপেক্ষা করুন...`;
        sendBtn.disabled = true;

        try {
            const response = await fetch('/.netlify/functions/solve-math', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image, prompt: promptText })
            });

            const data = await response.json();
            sendBtn.disabled = false;

            if (data.solution) {
                let formattedText = data.solution.replace(/\n/g, '<br>');
                solutionText.innerHTML = formattedText;
                
                if (window.MathJax) {
                    MathJax.typesetPromise([solutionText]).catch(function (err) {
                        console.log(err.message);
                    });
                }
            } else {
                solutionText.innerHTML = `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> সমস্যা হয়েছে: ${data.error || 'আবার চেষ্টা করুন।'}</span>`;
            }
        } catch (error) {
            sendBtn.disabled = false;
            solutionText.innerHTML = `<span class="text-danger"><i class="fa-solid fa-circle-exclamation"></i> নেটওয়ার্ক ধীরগতির কারণে রিকুয়েস্ট ড্রপ হয়েছে। আবার Send বাটনে চাপুন।</span>`;
        }
    }
</script>
</body>
</html>
