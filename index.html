<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubt Solver AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/dist/solid.js"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .solver-card { max-width: 750px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .preview-box { width: 100%; max-height: 280px; object-fit: contain; margin-top: 15px; border-radius: 10px; display: none; border: 1px solid #dee2e6; }
        .output-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-left: 6px solid #0d6efd; border-radius: 8px; display: none; }
        .btn-custom { padding: 10px 20px; font-weight: 500; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="solver-card text-center">
        <h2 class="mb-1">🚀 Doubt Solver AI</h2>
        <p class="text-muted">ছবি তুলুন, গ্যালারি থেকে আপলোড করুন অথবা প্রশ্ন লিখুন।</p>
        
        <div class="my-3">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <button class="btn btn-primary btn-custom m-1" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-image"></i> ছবি সিলেক্ট করুন</button>
        </div>

        <img id="imagePreview" class="preview-box" alt="Preview">

        <div class="input-group my-4 shadow-sm">
            <input type="text" id="promptInput" class="form-control form-control-lg" placeholder="প্রশ্নের দাগ নম্বর লিখুন বা কিছু জানতে চান তা লিখুন...">
            <button class="btn btn-success px-4" id="sendBtn" onclick="solveDoubt()"><i class="fa-solid fa-paper-plane"></i> Send</button>
        </div>

        <div class="output-box text-start" id="outputBox">
            <h5 class="fw-bold text-secondary">✨ এআই সমাধান:</h5>
            <div id="solutionText" style="line-height: 1.7; font-size: 16px;"></div>
        </div>
    </div>
</div>

<script>
    let base64Image = "";
    let mimeType = "image/jpeg";

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        mimeType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById('imagePreview');
            img.src = e.target.result;
            img.style.display = 'block';
            base64Image = e.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
    }

    async function solveDoubt() {
        const promptText = document.getElementById('promptInput').value || "Solve this academic doubt step by step.";
        const solutionText = document.getElementById('solutionText');
        const outputBox = document.getElementById('outputBox');
        const sendBtn = document.getElementById('sendBtn');

        outputBox.style.display = 'block';
        solutionText.innerHTML = `<div class="spinner-border text-primary spinner-border-sm"></div> ফ্রি এআইগুলোর মধ্যে থেকে খালি সার্ভার খোঁজা হচ্ছে... একটু অপেক্ষা করুন ভাই...`;
        sendBtn.disabled = true;

        try {
            // নেটলিফাই ব্যাকএন্ডে রিকোয়েস্ট পাঠানো (যেখানে টাইমিং অপ্টিমাইজ করা আছে)
            const response = await fetch('/.netlify/functions/solve-math', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image, prompt: promptText })
            });

            const data = await response.json();
            sendBtn.disabled = false;

            if (data.solution) {
                // মার্কডাউন ফরম্যাট ক্লিন করা এবং ম্যাথজ্যাক্স লাইভ করা
                let cleanText = data.solution.replace(/\n/g, '<br>');
                solutionText.innerHTML = cleanText;
                
                if (window.MathJax) {
                    MathJax.typesetPromise([solutionText]);
                }
            } else {
                solutionText.innerHTML = `<span class="text-danger">❌ সমস্যা হয়েছে: ${data.error || 'অনুগ্রহ করে আবার চেষ্টা করুন।'}</span>`;
            }
        } catch (error) {
            sendBtn.disabled = false;
            solutionText.innerHTML = `<span class="text-danger">❌ নেটওয়ার্ক ওভারলোড বা টাইমআউট হয়েছে। অনুগ্রহ করে আরেকবার Send বাটনে চাপুন।</span>`;
        }
    }
</script>
</body>
</html>
